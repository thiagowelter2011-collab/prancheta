    body = `<div>Jogue a mesma liga com amigos pela internet. Quem cria a sala vira o anfitrião: o mundo desta carreira passa a ser compartilhado e fica salvo no seu navegador. Os convidados entram pela tela inicial com o código e escolhem um clube.</div>
      <ul style="font-size:13px;padding-left:18px"><li>A data só avança quando todos os técnicos presentes clicam em <b>Estou pronto</b>.</li><li>As partidas rolam ao mesmo tempo para todos, com pausa no intervalo.</li><li>O anfitrião precisa manter o jogo aberto; se ele sair, a sala fecha. Para continuar outro dia, ele abre a sala de novo e os amigos entram com o mesmo nome.</li></ul>
      <div class="row"><button onclick="closeModal()">Fechar</button><button onclick="netCreate(true)" title="Só funciona entre abas deste mesmo navegador; serve para experimentar">Sala de teste neste PC</button><button class="primary" onclick="netCreate(false)">Criar sala</button></div>`;
  } else {
    const rows = humans().map(t => { const pr = PR(t.id); return `<tr class="${t.id === G.me ? 'me' : ''}"><td>${esc(pr.coach)}</td><td>${crest(t, 16)} ${t.name}</td><td class="muted">${DIVS[t.div]}</td><td>${pr.on === false ? '<span class="muted">ausente</span>' : pr.ready ? '<span class="up">pronto</span>' : 'na sala'}</td></tr>`; }).join('');
    body = `<div>${isHost() ? 'Passe este código para os seus amigos:' : 'Você está na sala:'}</div><div class="code">${esc(NET.code)}</div>
      <table><thead><tr><th>Técnico</th><th>Clube</th><th>Divisão</th><th>Situação</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="row"><button onclick="confirmBox('Sair da sala','${isHost() ? 'Fechar a sala desconecta todos os convidados. O jogo continua salvo com você.' : 'Sair da sala? Seu clube continua no mundo do anfitrião e você pode voltar com o mesmo nome.'}','Sair',()=>netLeave())">${isHost() ? 'Fechar sala' : 'Sair da sala'}</button><button class="primary" onclick="closeModal()">OK</button></div>`;
  }
  modal(`<h2 id="netbox">Jogar online</h2>${body}`);
}
function netJoinBox() {
  modal(`<h2>Entrar em uma sala</h2><div class="field" style="grid-template-columns:120px 1fr"><span class="muted">Código da sala</span><input id="jcode" maxlength="12" style="text-transform:uppercase" placeholder="ex.: KXPTR">
    <span class="muted">Seu nome</span><input id="jname" maxlength="24" placeholder="Técnico"></div>
    <div class="muted" style="margin-top:8px;font-size:12px">Se você já jogou nessa sala, use o mesmo nome para reassumir o seu clube.</div>
    <div class="row"><button onclick="closeModal()">Cancelar</button><button class="primary" onclick="netJoin(el('jcode').value, el('jname').value)">Entrar</button></div>`);
}
</script>
<script>
'use strict';
// Interface: telas, escalação por clique e partida ao vivo.

const UI = { view: 'start', tab: 'elenco', creating: false, pick: null, coach: '', slot: null, pl: null, div: 0, reg: 0, rd: 0, mk: { pos: '', src: 'all', sale: false, pay: false, q: '' } };
let LIVE = null, MCB = null, toastT = null;
const SPEEDS = [260, 110, 35];
const SHIELD = 'M3 2h18v9c0 6-4 9.5-9 11-5-1.5-9-5-9-11z';

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = n => n.toLocaleString('pt-BR');
const el = id => document.getElementById(id);

function crest(t, s = 20) {
  const a = PAL[t.c1], b = PAL[t.c2];
  const pat = [
    `<rect x="9" width="6" height="24" fill="${b}"/>`,
    `<rect y="8" width="24" height="6" fill="${b}"/>`,
    `<path d="M3 2h6l12 12v6h-4L3 6z" fill="${b}"/>`,
    `<rect x="12" width="12" height="24" fill="${b}"/>`,
    `<rect x="6" width="3" height="24" fill="${b}"/><rect x="15" width="3" height="24" fill="${b}"/>`][t.pat];
  return `<svg class="cr" width="${s}" height="${s}" viewBox="0 0 24 24"><defs><clipPath id="cp${t.id}"><path d="${SHIELD}"/></clipPath></defs>` +
    `<g clip-path="url(#cp${t.id})"><rect width="24" height="24" fill="${a}"/>${pat}</g><path d="${SHIELD}" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1"/></svg>`;
}
const tname = t => `<span class="link" onclick="event.stopPropagation();openTeam(${t.id})">${t.name}</span>`;
function bar(v) {
  return `<span class="bar ${v < 50 ? 'low' : v < 75 ? 'mid' : ''}" title="${Math.round(v)}%"><i style="width:${Math.round(v)}%"></i></span>`;
}
function moral(v) {
  return v >= 75 ? '<span class="up">Ótima</span>' : v >= 55 ? 'Boa' : v >= 40 ? '<span class="amber">Regular</span>' : '<span class="down">Baixa</span>';
}
const fdelta = p => p.d > 0 ? ' <span class="up">▲</span>' : p.d < 0 ? ' <span class="down">▼</span>' : '';
const ptags = p => (p.inj ? `<span class="tag inj" title="Lesionado">LES ${p.inj}</span>` : '') + (p.sus ? '<span class="tag sus" title="Suspenso">SUSP</span>' : '') +
  (p.yc ? `<span class="tag yc" title="Cartões amarelos acumulados">${p.yc}A</span>` : '') + (p.loan ? '<span class="tag loan" title="Emprestado">EMP</span>' : '') +
  (p.sale ? '<span class="tag sale">À VENDA</span>' : '') + (p.lend ? '<span class="tag sale" title="Disponível para empréstimo">P/ EMPRÉSTIMO</span>' : '');
const nota = p => p.rn ? (p.rs / p.rn).toFixed(1) : '–';
const divName = t => t.div < 4 ? `${DIVS[t.div]}, ${posOf(t)}º` : `Exterior (${t.uf})`;
const myH = h => MY().hist.find(x => x.s === h.s) || {};
const campTxt = h => { const m = myH(h); return m.div == null ? '—' : `${DIVS[m.div]}, ${m.pos}º`; };
const posTag = k => `<span class="pos ${k}">${POSN[k]}</span>`;
const fxRow = fx => `<div class="fx ${fx.h === G.me || fx.a === G.me ? 'me' : ''}"><span class="h">${tname(T(fx.h))} ${crest(T(fx.h), 16)}</span>
  <span class="sc">${scoreStr(fx)}</span><span>${crest(T(fx.a), 16)} ${tname(T(fx.a))}</span></div>`;

function toast(msg) {
  const t = el('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => { t.style.display = 'none'; }, 3200);
}
function modal(html, wide) {
  el('modal').innerHTML = `<div class="box ${wide ? 'wide' : ''}">${html}</div>`;
  el('modal').classList.add('show');
}
function closeModal() { el('modal').classList.remove('show'); el('modal').innerHTML = ''; }
function confirmBox(title, msg, yes, cb) {
  MCB = cb;
  modal(`<h2>${title}</h2><div>${msg}</div><div class="row"><button onclick="closeModal()">Cancelar</button><button class="primary" onclick="closeModal();MCB()">${yes}</button></div>`);
}
function alertBox(title, msg) {
  modal(`<h2>${title}</h2><div>${msg}</div><div class="row"><button class="primary" onclick="closeModal()">OK</button></div>`);
}

function render() {
  el('app').innerHTML = UI.view === 'editor' ? vEditor() : UI.view === 'start' ? vStart() : UI.view === 'join' ? vJoin() : UI.view === 'live' ? vLive() : MY().fired ? vFired() : UI.view === 'season' ? vSeason() : vHub();
}
function go(tab) {
  UI.tab = tab; UI.slot = UI.pl = null;
  if (tab === 'news') MY().unread = 0;
  if (tab === 'tabela') { UI.div = T(G.me).div; UI.reg = regOf(T(G.me)); }
  if (tab === 'jogos') UI.rd = clamp(G.day - 1, 0, G.cal.length - 1);
  render();
}

/* ---------- início ---------- */

function vStart() {
  if (!UI.creating) {
    return `<div class="start"><div class="hero"><div class="logo">Pran<span>cheta</span></div>
      <p>Manager de futebol brasileiro. Monte a escalação, defina a tática e leve seu time da Série D ao título da Série A. Jogo de fã, sem vínculo com clubes, jogadores ou ligas; os elencos são aproximados.</p>
      <div class="row">${hasSave() ? '<button class="primary" onclick="continueGame()">Continuar carreira</button>' : ''}
      <button class="${hasSave() ? '' : 'primary'}" onclick="newGameScreen()">Novo jogo</button>
      <button onclick="netJoinBox()">Entrar em sala online</button>
      <button onclick="openEditor()">Editor de times${hasCustomDB() ? ' ●' : ''}</button>
      <button onclick="el('imp').click()">Importar jogo salvo</button><input id="imp" type="file" accept=".json,application/json" style="display:none" onchange="importSave(this.files[0])"></div></div></div>`;
  }
  const cols = [0, 1, 2, 3].map(d => `<div class="panel"><h3>${DIVS[d]}</h3>${G.teams.filter(t => t.div === d).map(t =>
    `<div class="club ${UI.pick === t.id ? 'sel' : ''}" onclick="UI.pick=${t.id};render()">${crest(t)}<span>${t.name} <span class="muted">${t.uf}</span></span><b title="Força média dos 11 melhores">${Math.round(top11(t))}</b></div>`).join('')}</div>`).join('');
  const pk = UI.pick != null ? T(UI.pick) : null;
  return `<div class="start"><div class="row" style="justify-content:space-between"><div class="logo" style="font-size:28px">Pran<span>cheta</span></div>
    <button onclick="UI.creating=false;render()">Voltar</button></div>
    <div class="panel" style="margin-top:14px"><div class="row">
      <label>Seu nome: <input id="coach" maxlength="24" value="${esc(UI.coach)}" oninput="UI.coach=this.value" placeholder="Técnico"></label>
      <span class="muted">${pk ? `Time escolhido: <b style="color:var(--text)">${pk.name}</b> · ${DIVS[pk.div]} · ${REGS[regOf(pk)].n} · ${pk.std} (${num(pk.cap)} lugares) · caixa ${$$(pk.cash)}` : 'Escolha um clube abaixo. O número é a força média do time titular.'}</span>
      <button class="primary" style="margin-left:auto" ${pk ? '' : 'disabled'} onclick="startGame()">Começar</button></div></div>
    <div class="pickgrid">${cols}</div></div>`;
}
function newGameScreen() {
  const mk = () => { newWorld(); UI.creating = true; UI.pick = null; render(); };
  if (hasSave()) confirmBox('Novo jogo', 'Começar um novo jogo vai substituir a carreira salva quando você escolher um time. Continuar?', 'Novo jogo', mk); else mk();
}
function startGame() {
  G.me = UI.pick;
  addHuman(G.me, (UI.coach || '').trim() || 'Técnico');
  skipByes(); save();
  UI.creating = false; UI.view = 'hub'; go('elenco');
}
function continueGame() {
  if (!load() || G.me == null) { toast('Não foi possível carregar o jogo salvo.'); return; }
  UI.view = 'hub'; go('elenco');
}

/* ---------- hub ---------- */

function vHub() {
  const me = T(G.me), pos = posOf(me);
  const tabs = [['elenco', 'Elenco e tática'], ['tabela', 'Competições'], ['jogos', 'Jogos'], ['mercado', 'Transferências'], ['base', 'Base e treino'], ['fin', 'Finanças e estádio'], ['carreira', 'Carreira'], ['news', 'Notícias']];
  const body = { elenco: vElenco, tabela: vTabela, jogos: vJogos, mercado: vMercado, base: vBase, fin: vFin, carreira: vCarreira, news: vNews }[UI.tab]();
  return `<div class="top">${crest(me, 38)}<div><div class="name">${me.name}</div><div class="muted">Técnico ${esc(MY().coach)} · ${DIVS[me.div]} · ${pos}º lugar</div></div>
    <div class="stat"><small>Temporada</small><b>${G.season}</b></div>
    <div class="stat"><small>Data</small><b>${Math.min(G.day + 1, G.cal.length)}/${G.cal.length}</b></div>
    <div class="stat"><small>Caixa</small><b class="${me.cash < 0 ? 'down' : ''}">${$$(me.cash)}</b></div>
    <div class="stat"><button onclick="toast(save()?'Jogo salvo.':'Não foi possível salvar.')">Salvar</button> <button onclick="exportSave()" title="Baixa a carreira em um arquivo, para guardar ou levar a outro computador">Exportar</button> <button class="${online() ? 'on' : ''}" onclick="netBox()">Online${online() ? ' · ' + NET.code : ''}</button> <button onclick="helpBox()">Ajuda</button> <button onclick="exitGame()">Sair</button></div></div>
    <div class="tabs">${tabs.map(([k, n]) => `<button class="${UI.tab === k ? 'on' : ''}" onclick="go('${k}')">${n}${k === 'news' && MY().unread ? `<span class="badge">${MY().unread}</span>` : ''}${k === 'mercado' && MY().offers.length ? `<span class="badge">${MY().offers.length}</span>` : ''}</button>`).join('')}</div>
    <div class="main">${body}</div>`;
}
function exitGame() { save(); netLeave(); UI.view = 'start'; UI.creating = false; render(); }

/* ---------- elenco e tática ---------- */

function vElenco() {
  const t = T(G.me); cleanLineup(t);
  const slots = FORMS[t.form];
  const ps = t.players.slice().sort((a, b) => POS_ORDER[a.pos] - POS_ORDER[b.pos] || b.f - a.f);
  const rows = ps.map(p => {
    const inXI = t.xi.includes(p.id), inB = t.bench.includes(p.id);
    const ct = p.loan ? '<span class="muted">empréstimo</span>' : `<span class="${p.ce <= G.season ? 'amber' : ''}" title="${p.ce <= G.season ? 'Termina no fim desta temporada' : ''}">${p.ce}</span>`;
    return `<tr class="${UI.pl === p.id ? 'sel' : ''} ${ok(p) ? '' : 'out'}" onclick="selPlayer(${p.id})" draggable="true" ondragstart="event.dataTransfer.setData('text','${p.id}')">
      <td>${inXI ? '<span class="st T" title="Titular">T</span>' : inB ? '<span class="st R" title="Reserva">R</span>' : ''}</td>
      <td>${posTag(p.pos)}</td><td>${p.n}${ptags(p)}</td><td class="c">${p.age}</td>
      <td class="f">${p.f}${fdelta(p)}</td><td class="tr">${p.tr.join(', ')}</td><td>${bar(p.en)}</td><td>${moral(p.mo)}</td>
      <td class="c">${p.gp}</td><td class="c">${p.g + (p.go || 0)}</td><td class="c">${nota(p)}</td><td class="r">${$$(p.sal)}</td><td class="c">${ct}</td><td class="r">${$$(value(p))}</td>
      <td><button class="mini ${inB ? 'on warn' : ''}" title="Colocar/tirar do banco" onclick="event.stopPropagation();toggleBench(${p.id})">Banco</button>
      <button class="mini" title="Contrato, venda, empréstimo e dispensa" onclick="event.stopPropagation();playerMenu(${p.id})">Opções</button></td></tr>`;
  }).join('');

  const light = c => LIGHT.includes(c);
  const pitch = slots.map((s, i) => {
    const p = P(t.xi[i]);
    return `<div class="slot ${UI.slot === i ? 'sel' : ''} ${p ? '' : 'empty'}" style="left:${s[1]}%;top:${s[2]}%" onclick="selSlot(${i})" draggable="true" ondragstart="event.dataTransfer.setData('text','s${i}')" ondragover="event.preventDefault()" ondrop="event.preventDefault();dropOn(${i},event.dataTransfer.getData('text'))">
      <div class="shirt" style="background:${PAL[t.c1]};border-color:${PAL[t.c2]};color:${light(t.c1) ? '#111' : '#fff'}">${p ? p.f : '+'}</div>
      <div class="sn ${p && p.pos !== s[0] ? 'imp' : ''}">${p ? p.n : 'vazio'}</div><div class="sr">${POSN[s[0]]}</div></div>`;
  }).join('');

  let next;
  if (G.over) next = `<div class="next"><div class="vs">Temporada encerrada</div></div><button class="primary big" onclick="UI.view='season';render()">Ver resumo da temporada</button>`;
  else {
    const m = myFx(G.day);
    if (m) {
      const fx = m.fx, home = fx.h === t.id, op = T(home ? fx.a : fx.h);
      next = `<h3>Próximo jogo · ${m.g.title}</h3><div class="next">${crest(op, 34)}<div><div class="vs">${tname(op)}</div>
        <div class="muted">${home ? 'Em casa' : 'Fora de casa'} · ${divName(op)} · força ${Math.round(top11(op))} · ${op.form}</div>
        ${fx.agg ? `<div class="amber">Jogo de ida: ${T(fx.h).name} ${fx.agg[0]} x ${fx.agg[1]} ${T(fx.a).name}</div>` : ''}</div></div>
        <button class="primary big" onclick="startRound()">${playLabel('Jogar')}</button>`;
    } else {
      next = `<h3>${dayName(G.day)}</h3><div class="next"><div><div class="vs">Sem jogo para o ${t.name}</div><div class="muted">Seu time folga nesta data; os outros jogos serão simulados.</div></div></div>
        <button class="primary big" onclick="startRound()">${playLabel('Avançar data')}</button>`;
    }
  }
  const sel = (k, opts, cur) => `<select onchange="setTac('${k}',this.value)">${opts.map(([v, n]) => `<option value="${v}" ${String(v) === String(cur) ? 'selected' : ''}>${n}</option>`).join('')}</select>`;
  const bench = t.bench.map(P);
  const away = G.teams.filter(x => x !== t).flatMap(x => x.players.filter(p => p.loan && p.loan.from === t.id).map(p => `<span class="chip">${POSN[p.pos]} ${p.n} ${p.f} · ${x.name}</span>`));

  return `<div class="cols"><div class="panel scroll"><table class="squad"><thead><tr><th></th><th>Pos</th><th>Jogador</th><th class="c">Idade</th><th>Força</th><th>Características</th>
      <th>Energia</th><th>Moral</th><th class="c">J</th><th class="c">G</th><th class="c" title="Nota média na temporada">Nota</th><th class="r">Salário</th><th class="c">Contrato</th><th class="r">Valor</th><th></th></tr></thead><tbody>${rows}</tbody></table>
      ${away.length ? `<div class="chips"><span class="muted" style="font-size:12px">Emprestados a outros clubes:</span>${away.join('')}</div>` : ''}
      <div class="muted" style="margin-top:8px;font-size:12px">Para escalar: arraste o jogador até a camisa no campo, ou clique no jogador e depois na camisa. Arraste uma camisa sobre outra para trocar de posição. Nome em amarelo no campo = jogador improvisado. Salários são pagos a cada data do calendário. Contrato em amarelo termina no fim desta temporada.</div></div>
    <div class="grid"><div class="panel">${next}${readyChips()}</div>
      <div class="panel"><div class="pitch">${pitch}</div>
        <div class="chips"><span class="muted" style="font-size:12px">Banco (${bench.length}/7):</span>${bench.map(p => `<span class="chip">${POSN[p.pos]} ${p.n} ${p.f}</span>`).join('') || '<span class="muted" style="font-size:12px">vazio</span>'}</div>
        <div class="field"><span class="muted">Formação</span>${sel('form', Object.keys(FORMS).map(k => [k, k]), t.form)}
          <span class="muted">Estilo</span>${sel('style', STYLE.map((s, i) => [i, s.n]), t.style)}
          <span class="muted">Marcação</span>${sel('mark', MARK.map((s, i) => [i, s.n]), t.mark)}
          <span class="muted">Treino</span>${sel('train', TRAIN.map((s, i) => [i, s.n]), t.train || 0)}</div>
        <button style="width:100%;margin-top:10px" onclick="autoBtn()">Escalar automaticamente</button></div></div></div>`;
}

function assign(pid, slot) {
  const t = T(G.me), p = P(pid);
  if (!ok(p)) { toast(`${p.n} está ${p.inj ? 'lesionado' : 'suspenso'} e não pode ser escalado.`); return; }
  const from = t.xi.indexOf(pid), prev = t.xi[slot];
  if (from >= 0) t.xi[from] = prev;
  else if (prev != null && t.bench.length < 7) t.bench.push(prev);
  t.xi[slot] = pid;
  t.bench = t.bench.filter(id => id !== pid);
  UI.slot = UI.pl = null;
}
function autoBtn() { autoPick(T(G.me)); UI.slot = UI.pl = null; netPushTeam(); render(); }
function selPlayer(pid) {
  if (UI.slot != null) { assign(pid, UI.slot); netPushTeam(); }
  else UI.pl = UI.pl === pid ? null : pid;
  render();
}
function selSlot(i) {
  const t = T(G.me);
  if (UI.pl != null) assign(UI.pl, i);
  else if (UI.slot != null && UI.slot !== i) { [t.xi[UI.slot], t.xi[i]] = [t.xi[i], t.xi[UI.slot]]; UI.slot = null; }
  else UI.slot = UI.slot === i ? null : i;
  netPushTeam(); render();
}
function dropOn(i, d) {
  const t = T(G.me);
  UI.slot = UI.pl = null;
  if (d[0] === 's') { const j = +d.slice(1); if (j !== i) [t.xi[j], t.xi[i]] = [t.xi[i], t.xi[j]]; }
  else if (P(+d)) assign(+d, i);
  netPushTeam(); render();
}
function toggleBench(pid) {
  const t = T(G.me), p = P(pid);
  if (t.bench.includes(pid)) t.bench = t.bench.filter(id => id !== pid);
  else if (t.xi.includes(pid)) toast('Esse jogador já é titular.');
  else if (!ok(p)) toast(`${p.n} não está disponível.`);
  else if (t.bench.length >= 7) toast('O banco já tem 7 jogadores.');
  else t.bench.push(pid);
  netPushTeam(); render();
}
function setTac(k, v) {
  const t = T(G.me);
  if (k === 'form') { t.form = v; autoPick(t); UI.slot = UI.pl = null; } else t[k] = +v;
  netPushTeam(); render();
}

function playerMenu(pid) {
  const p = P(pid);
  const head = `<h2>${posTag(p.pos)} ${p.n}</h2><div class="muted">${p.age} anos · força ${p.f} · ${p.tr.join(', ')}</div>
    <div class="kpi" style="margin:12px 0"><div><small>Salário por data</small><b>${$$(p.sal)}</b></div><div><small>Contrato</small><b>${p.loan ? 'Empréstimo' : 'até ' + p.ce}</b></div><div><small>Valor de mercado</small><b>${$$(value(p))}</b></div></div>`;
  if (p.loan) { modal(`${head}<div>Emprestado pelo ${T(p.loan.from).name}. Ele volta ao clube de origem no fim da temporada.</div><div class="row"><button class="primary" onclick="closeModal()">Fechar</button></div>`); return; }
  const yrs = (p.age >= 33 ? [1] : [1, 2, 3]).map(y => `<option value="${G.season + y}">até o fim de ${G.season + y}</option>`).join('');
  modal(`${head}
    <h3>Renovar contrato</h3><div class="row"><select id="rnce">${yrs}</select><span>por <b>${$$(renewAsk(p))}</b> por data</span>
      <button class="primary" style="margin-left:auto" onclick="doRenew(${pid})">Renovar</button></div>
    <h3 style="margin-top:16px">Mercado</h3><div class="row">
      <button class="${p.sale ? 'on' : ''}" onclick="toggleFlag(${pid},'sale')">${p.sale ? 'Tirar da lista de venda' : 'Colocar à venda'}</button>

function tieRow(t) {
  const f = t.legs[0], g = t.legs[1], a = T(f.h), b = T(f.a), mine = f.h === G.me || f.a === G.me;
  const sc = f.gh == null ? 'x' : !g ? scoreStr(f) : `${f.gh} x ${f.ga}` + (g.gh != null ? ` · ${g.ga} x ${g.gh}` + (g.pen ? ` (${g.pen[1]}-${g.pen[0]} pên.)` : '') : '');
  const w = id => t.w === id ? 'style="font-weight:700"' : t.w != null ? 'class="muted"' : '';
  return `<div class="fx ${mine ? 'me' : ''}"><span class="h"><span ${w(a.id)}>${tname(a)}</span> ${crest(a, 16)}</span><span class="sc">${sc}</span><span>${crest(b, 16)} <span ${w(b.id)}>${tname(b)}</span></span></div>`;
}

// o time ainda pode ter jogo numa data futura de mata-mata que não foi sorteada?
function stillIn(di) {
  const d = G.cal[di], me = G.me;
  if (d.t === 'S') return false;
  if (d.t === 'A') {
    if (!G.am || !G.am.ids.includes(me)) return false;
    if (!G.am.ko.length) return true;
    const last = G.am.ko[G.am.ko.length - 1].find(t => t.legs[0].h === me || t.legs[0].a === me);
    return !!last && (last.w == null || last.w === me) && d.i > [7, 9, 10][G.am.ko.length - 1];
  }
  if (d.t === 'C') return !G.cup.ph.some(ties => ties.some(t => t.w != null && t.w !== me && (t.legs[0].h === me || t.legs[0].a === me)));
  const ko = G.reg[regOf(T(me))].ko;
  if (!ko.length) return true;
  const semi = ko[0].find(f => f.h === me || f.a === me);
  return !!semi && d.i === REG_ROUNDS + 1 && ko.length === 1 && (semi.w == null || semi.w === me);
}
function vJogos() {
  const me = T(G.me), rd = UI.rd;
  const mine = G.cal.map((_, di) => {
    const m = myFx(di);
    if (!m) return di >= G.day && G.cal[di].t !== 'L' && stillIn(di) ? `<tr><td class="muted">${dayName(di)}</td><td></td><td class="muted">a definir</td><td></td></tr>` : '';
    const fx = m.fx, home = fx.h === me.id, op = T(home ? fx.a : fx.h);
    let res = '';
    if (fx.gh != null) {
      const s = fx.w != null && fx.c !== 'L' && !fx.agg && fx.pen ? (fx.w === me.id ? 1 : -1) : Math.sign((home ? 1 : -1) * (fx.gh - fx.ga));
      const k = s > 0 ? 'V' : s < 0 ? 'D' : 'E';
      res = `<span class="res ${k}">${k}</span> ${scoreStr(fx)}`;
    }
    return `<tr class="${di === G.day ? 'me' : ''}" style="cursor:pointer" onclick="UI.rd=${di};render()"><td>${dayName(di)}</td><td>${home ? 'Casa' : 'Fora'}</td><td>${crest(op, 16)} ${tname(op)}</td><td>${res}</td></tr>`;
  }).join('');
  const groups = dayGroups(rd).slice().sort((a, b) => b.fxs.some(f => f.h === G.me || f.a === G.me) - a.fxs.some(f => f.h === G.me || f.a === G.me));

  return `<div class="cols2"><div class="panel scroll"><h3>Calendário do ${me.name}</h3><table><thead><tr><th>Data</th><th>Local</th><th>Adversário</th><th>Resultado</th></tr></thead><tbody>${mine}</tbody></table></div>

}

function openOffer(pid) {
  const me = T(G.me), p = P(pid), t = teamOf(pid);

// Leitura de elenco colado. Aceita uma linha por jogador (com posição e idade na mesma linha, separadas por tabulação ou espaços),
// listas divididas por títulos ("Goleiros", "Defensores"...) e listas em que a posição ou a idade vêm na linha de baixo do nome.
const PASTE_POS = [
  [/^(goleir[oa]s?|guarda-?redes|gr|gol|gk)$/, 'G'],
  [/^(lateral[- ]?(direito|dir\.?)|laterais direitos|ld|ala direit[oa])$/, 'LD'],
  [/^(lateral[- ]?(esquerdo|esq\.?)|laterais esquerdos|le|ala esquerd[oa])$/, 'LE'],
  [/^(zagueir[oa]s?|defensor(es)?|defesas?|defesa[- ]central|zag|dc|laterais|lateral)$/, 'Z'],
  [/^(volantes?|m[eé]dio[- ]defensivo|primeiro volante|segundo volante|vol|mdc)$/, 'V'],
  [/^(mei[ao]s?|meio-?campistas?|meio[- ]campo|m[eé]dios?|meia[- ](central|ofensivo|atacante|direita|esquerda|armador)|m[eé]dio[- ](centro|ofensivo|direito|esquerdo)|mei|mc|mo)$/, 'M'],
  [/^(atacantes?|avan[çc]ados?|centroavantes?|pontas?|ponta[- ](direita|esquerda)|ponta de lan[çc]a|extremos?|extremo[- ](direito|esquerdo)|seg(undo|\.)? atacante|ata|pl|ca)$/, 'A']
];
const PASTE_SKIP = /^(elenco|plantel|jogador(es)?|nome|idade|posi[çc][ãa]o|pos\.?|nac\.?|nacionalidade|n[ºo°]\.?|#|contrato|valor( de mercado)?|altura|p[ée]|desde|at[ée]|jogos|gols|brasil|argentina|uruguai|paraguai|col[ôo]mbia|chile|equador|venezuela|peru|bol[íi]via|portugal|espanha|it[áa]lia|fran[çc]a|alemanha|inglaterra|angola|m[ée]xico|estados unidos|holanda|b[ée]lgica)$/;
const pastePos = c => { const x = c.toLowerCase().replace(/[.:]+$/, '').trim(); const m = PASTE_POS.find(([re]) => re.test(x)); return m ? m[1] : null; };
function parseSquad(text) {
  const out = [], seen = new Set(), year = new Date().getFullYear();
  let cur = null, last = null;
  String(text).split(/\n/).forEach(raw => {
    const line = raw.trim();
    if (!line) return;
    let pos = null, age = null, name = null, plural = false;
    line.split(/\t+|\s{2,}|\s[|·•–-]\s/).forEach(cell => {
      let c = cell.trim();
      const d = c.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-]((19|20)\d{2})/), a = c.match(/(\d{1,2})\s*anos/i);
      if (a) { age = +a[1]; c = c.replace(a[0], '').replace(/[()]/g, '').trim(); }
      else if (d) { age = year - +d[3]; c = c.replace(d[0], '').replace(/[()]/g, '').trim(); }
      c = c.replace(/^\d{1,2}[.)]?\s+(?=\D)/, ''); // número da camisa na frente do nome
      if (!c) return;
      const p = pastePos(c);
      if (p) { pos = p; plural = /s$/i.test(c.replace(/[.:]+$/, '')) && c.length > 3; return; }
      if (/^\d+$/.test(c)) { const v = +c; if (name && age == null && v >= 15 && v <= 45) age = v; return; }
      if (name || PASTE_SKIP.test(c.toLowerCase()) || !/[A-Za-zÀ-ÿ]{2}/.test(c) || /[€$%]|\d{3,}/.test(c)) return;
      // "Fulano Goleiro" ou "Fulano (Zagueiro)" na mesma célula
      const w = c.replace(/[()]/g, ' ').trim().split(/\s+/);
      for (let k = Math.min(3, w.length - 1); k >= 1 && !pos; k--) { const p2 = pastePos(w.slice(-k).join(' ')); if (p2) { pos = p2; w.splice(-k); } }
      name = w.join(' ').slice(0, 30);
    });
    if (name) {
      if (seen.has(name.toLowerCase())) return;
      seen.add(name.toLowerCase());
      last = { n: name, pos: pos || cur, age, own: !!pos };
      out.push(last);
    } else {
      if (pos) { if (plural || !last || last.own) cur = pos; else { last.pos = pos; last.own = true; } }
      if (age != null && last && last.age == null) last.age = age;
    }
  });
  return out;
}
function edPasteBox() {
  modal(`<h2>Colar elenco · ${esc(edClub().n)}</h2><div style="font-size:13px" class="muted">Copie a lista de jogadores de onde preferir e cole abaixo. O ideal é um jogador por linha, com posição e idade (ex.: <b>Rossi  Goleiro  29 anos</b>), mas listas divididas por títulos como "Goleiros" e "Atacantes" também funcionam. A força é estimada pelo nível do clube e você ajusta depois na tabela.</div>
    <textarea id="edpaste" rows="12" style="width:100%;margin-top:10px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px;font:13px/1.4 ui-monospace,Consolas,monospace" placeholder="Rossi&#9;Goleiro&#9;29 anos&#10;Léo Pereira&#9;Zagueiro&#9;29 anos&#10;..."></textarea>
    <label style="display:block;margin-top:8px"><input type="checkbox" id="edrepl" checked> Substituir o elenco atual (desmarque para acrescentar)</label>
    <div class="row"><button onclick="closeModal()">Cancelar</button><button class="primary" onclick="edPaste()">Ler elenco</button></div>`, true);
}
function edPaste() {
  const c = edClub(), got = parseSquad(el('edpaste').value), base = Math.round(84 - UI.ed.sel * 0.55) - 3;
  if (!got.length) { toast('Não encontrei nomes de jogadores nesse texto.'); return; }
  if (el('edrepl').checked) c.sq = [];
  const room = MAX_SQUAD - c.sq.length, noPos = got.filter(p => !p.pos).length, noAge = got.filter(p => p.age == null).length;
  got.slice(0, room).forEach(p => {
    const age = clamp(p.age == null ? 25 : p.age, 15, 45);
    c.sq.push([p.pos || 'M', p.n, age, clamp(base - (age <= 20 ? 6 : age <= 23 ? 3 : age >= 34 ? 2 : 0), 1, 99)]);
  });
  edSave(); closeModal(); render();
  alertBox('Elenco lido', `${Math.min(got.length, room)} jogador(es) adicionados ao ${esc(c.n)}.` + (got.length > room ? ` ${got.length - room} ficaram de fora (limite de ${MAX_SQUAD}).` : '') +
    (noPos ? ` ${noPos} sem posição reconhecida entraram como meia.` : '') + (noAge ? ` ${noAge} sem idade entraram com 25 anos.` : '') + ' Confira a tabela e ajuste posições e forças.');
}

function edImport(file) {
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result).clubs;
      if (!validDB(d)) throw new Error('formato');
      UI.ed = { db: d, sel: 0 }; edSave(); render(); toast('Base importada.');
    } catch (e) { alertBox('Não foi possível importar', 'O arquivo não é uma base de times do Prancheta, ou está incompleto (são 80 clubes, com pelo menos 4 em cada região).'); }
  };
  rd.readAsText(file);
}

  });
}

function exportSave() {
  save();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(G)], { type: 'application/json' }));
  a.download = `prancheta-${T(G.me).name.replace(/[^\w]+/g, '-').toLowerCase()}-${G.season}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importSave(file) {
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const g = JSON.parse(rd.result);
      if (!g || g.v !== 2 || !Array.isArray(g.teams) || g.me == null) throw new Error('formato');
      netLeave(); G = g; PM = null; migrate(); save();
      UI.view = 'hub'; go('elenco');
      toast('Jogo importado.');
    } catch (e) { alertBox('Não foi possível importar', 'O arquivo escolhido não é um jogo salvo do Prancheta desta versão.'); }
  };
  rd.readAsText(file);
}

/* ---------- finanças / notícias ---------- */

function vFin() {
  const me = T(G.me), wages = me.players.reduce((s, p) => s + p.sal, 0), f = MY().fin;
  const bal = f.spon + f.tick + f.tin + f.prem - f.sal - f.tout - f.obras;
  const line = (n, v) => `<tr><td>${n}</td><td class="r ${v < 0 ? 'down' : v > 0 ? 'up' : ''}">${$$(v)}</td></tr>`;
  return `<div class="cols2"><div class="grid"><div class="panel"><h3>Situação</h3><div class="kpi"><div><small>Caixa</small><b class="${me.cash < 0 ? 'down' : ''}">${$$(me.cash)}</b></div>
      <div><small>Patrocínio / data</small><b>${$$(me.spon)}</b></div><div><small>Folha salarial / data</small><b>${$$(wages)}</b></div></div>
      ${me.cash < 0 ? '<div class="msg" style="margin:10px 0 0">O clube está no vermelho. Venda jogadores ou reduza a folha: sem caixa você não consegue contratar.</div>' : ''}</div>
    <div class="panel"><h3>Balanço da temporada ${G.season}</h3><table><tbody>${line('Patrocínio', f.spon)}${line('Bilheteria', f.tick)}${line('Premiações (Copa e regional)', f.prem)}${line('Venda de jogadores', f.tin)}${line('Salários e rescisões', -f.sal)}
      ${line('Compras e empréstimos', -f.tout)}${line('Obras no estádio', -f.obras)}<tr><td><b>Resultado</b></td><td class="r ${bal < 0 ? 'down' : 'up'}"><b>${$$(bal)}</b></td></tr></tbody></table>
      <div class="muted" style="margin-top:8px;font-size:12px">A premiação da liga é paga no fim da temporada (Série ${'ABCD'[me.div]}: até ${$$(PRIZE[me.div])} para o campeão). Patrocínio e salários correm a cada uma das ${G.cal.length} datas do calendário.</div></div></div>
    <div class="panel"><h3>${me.std}</h3><div class="kpi"><div><small>Capacidade</small><b>${num(me.cap)}</b></div><div><small>Último público</small><b>${me.att ? num(me.att) : '—'}</b></div>
      <div><small>Ingresso</small><b>R$ ${me.ticket}</b></div></div>
      <div class="field" style="grid-template-columns:150px 1fr"><span class="muted">Preço do ingresso</span><span><input type="number" min="1" max="500" value="${me.ticket}" style="width:90px" onchange="setTicket(this.value)"> <span class="muted">sugerido: R$ ${TICKET[me.div]}</span></span>
        <span class="muted">Ampliar estádio</span><span class="row"><button onclick="askExpand(1000)">+1.000 (${$$(1000 * SEAT_COST)})</button><button onclick="askExpand(5000)">+5.000 (${$$(5000 * SEAT_COST)})</button></span></div>
      <div class="muted" style="margin-top:10px;font-size:12px">O público depende do tamanho da torcida, da posição na tabela, da fase da competição e do preço. Ingresso caro esvazia o estádio; ampliar só compensa se o estádio já lota.</div></div></div>`;
}
function setTicket(v) { T(G.me).ticket = clamp(Math.round(+v) || TICKET[T(G.me).div], 1, 500); netPushTeam(); render(); }
function askExpand(n) {
  confirmBox('Ampliar estádio', `Construir ${num(n)} novos lugares por ${$$(n * SEAT_COST)}?`, 'Construir', () => act('expand', [n], e => { toast(e || 'Obra concluída.'); render(); }));
}
function vNews() {
  return `<div class="panel news"><h3>Notícias</h3>${MY().news.map(n => `<div><small>${n.s}${n.d ? ' · ' + n.d : ''}</small>${esc(n.t)}</div>`).join('') || '<div class="muted">Nada por aqui ainda.</div>'}</div>`;
}

/* ---------- partida ao vivo ---------- */

// simula sozinho as datas em que o time não joga; para se chegar uma proposta, para ela não expirar sem ser vista
function skipByes() {
  if (online()) return 0;
  const done = [];
  while (!G.over && !MY().fired && !MY().offers.length && !myFx(G.day)) {
    done.push(dayName(G.day));
    dayGroups(G.day).forEach(g => g.fxs.forEach(simMatch));
    endDay();
  }
  if (done.length) { addNews(`Datas sem jogo do seu time foram simuladas: ${done.join('; ')}. Os resultados estão na aba Jogos.`); save(); }
  return done.length;
}

function startRound(force) {
  if (online()) { netReady(!MY().ready); return; }
  const me = T(G.me), mine = myFx(G.day), groups = dayGroups(G.day);
  cleanLineup(me);
  if (!mine) { // folga: simula tudo e mostra os resultados
    groups.forEach(g => g.fxs.forEach(simMatch));
    endDay(); skipByes();
    if (G.over) { UI.view = 'season'; render(); } else { go('jogos'); toast('Data simulada. Veja os resultados.'); }
    return;
  }
  if (!force && !validXI(me)) {
    confirmBox('Escalação incompleta', 'Há vaga vazia ou jogador lesionado/suspenso entre os titulares. Quer que o auxiliar escale o melhor time disponível?', 'Escalar e jogar', () => { autoPick(me); startRound(true); });
    return;
  }
  me.bench = me.bench.filter(id => ok(P(id)));
  let ms = null, title = '';
  groups.forEach(g => {
    if (g.fxs.includes(mine.fx)) { ms = g.fxs.map(mkMatch); title = g.title; } else g.fxs.forEach(simMatch);
  });
  const m = ms.find(x => x.h.human || x.a.human);
  LIVE = { ms, mine: m, title, k: m.h.human ? 'h' : 'a', speed: 0, paused: true, skip: false, done: false, msg: 'Tudo pronto. Clique em Iniciar para a bola rolar.', so: null, sb: null, timer: null, started: false };
  UI.view = 'live'; render();
}

function tick() {
  if (!LIVE || LIVE.done || LIVE.paused) return;
  const m = LIVE.mine;
  do {
    LIVE.ms.forEach(step);
    if (m.needSub) {
      m.needSub = 0;
      const X = m[LIVE.k];
      if (LIVE.skip) injSub(m, LIVE.k, X);
      else if (X.subs < 5 && X.bench.length) { LIVE.paused = true; LIVE.msg = 'Jogador lesionado! Escolha o lesionado e um reserva para substituir, depois continue.'; }
    }
    if (m.min === 45 && !LIVE.skip) {
      if (!LIVE.paused) LIVE.msg = 'Intervalo. Ajuste o time e continue.';
      LIVE.paused = true;
    }
    if (m.min >= 90) { LIVE.ms.forEach(finish); endDay(); LIVE.done = true; LIVE.paused = false; LIVE.msg = ''; break; }
  } while (LIVE.skip);
  render();
  if (!LIVE.done && !LIVE.paused) LIVE.timer = setTimeout(tick, SPEEDS[LIVE.speed]);
}
function livePlay() {
  if (!LIVE || LIVE.done) return;
  if (online()) { if (LIVE.paused) netReady(!MY().ready); return; }
  clearTimeout(LIVE.timer);
  LIVE.paused = !LIVE.paused; LIVE.started = true; LIVE.msg = '';
  if (LIVE.paused) render(); else tick();
}
function liveSpeed(s) { if (online()) return; LIVE.speed = s; render(); }
function liveSkip() { if (online()) return; clearTimeout(LIVE.timer); LIVE.skip = true; LIVE.paused = false; LIVE.started = true; tick(); }
function liveSel(kind, v) {
  if (kind === 'o') LIVE.so = LIVE.so === v ? null : v; else LIVE.sb = LIVE.sb === v ? null : v;
  render();
}
function liveSub() {
  if (isGuest()) { act('liveSub', [LIVE.so, LIVE.sb], e => { if (e) toast(e); }); LIVE.so = LIVE.sb = null; render(); return; }
  const m = LIVE.mine, X = m[LIVE.k], e = X.on[LIVE.so], p = X.bench.find(b => b.id === LIVE.sb);
  if (!e || !p) return;
  if (X.subs >= 5) { toast('Você já fez as 5 substituições.'); return; }
  if (e.st === 'red') { toast('Jogador expulso não pode ser substituído.'); return; }
  sub(m, LIVE.k, X, e, p);
  LIVE.so = LIVE.sb = null;
  render();
}
function liveTac(k, v) { T(G.me)[k] = +v; if (isGuest()) act('liveTac', [k, +v]); render(); }
function afterMatch() {
  if (online()) { netAfterMatch(); return; }
  LIVE = null;
  if (skipByes()) toast('Datas sem jogo do seu time foram simuladas.');
  UI.view = G.over ? 'season' : 'hub';
  if (UI.view === 'hub') go('elenco'); else render();
}

const ycN = (m, k) => m.yn ? m.yn[k] : [...m.ycs.keys()].filter(p => m[k].played.has(p)).length;
function vLive() {
  if (!LIVE.mine) return vLiveWatch();
  const L = LIVE, m = L.mine, me = T(G.me), X = m[L.k], fx = m.fx;
  const games = L.ms.map(x => `<div class="g ${x === m ? 'me' : ''} ${x.last && x.last.startsWith(x.min + "'") ? 'flash' : ''}"><span class="h">${x.h.t.name}</span>${crest(x.h.t, 20)}<b>${x.h.g}</b><span class="muted c">x</span><b>${x.a.g}</b>${crest(x.a.t, 20)}<span>${x.a.t.name}</span>
    <small>${x.fx.pen ? `Pênaltis: ${x.fx.pen[0]} x ${x.fx.pen[1]}` : x.last || (x.fx.agg ? `Ida: ${x.fx.agg[0]} x ${x.fx.agg[1]}` : '')}</small></div>`).join('');
  const feed = m.ev.slice().reverse().map(e => `<div class="${e.type} ${e.k === L.k ? '' : 'them'}"><span class="muted">${e.min}'</span> ${e.txt}</div>`).join('');
  const on = X.on.map((e, i) => `<div class="lp ${L.so === i ? 'sel' : ''} ${e.st}" onclick="liveSel('o',${i})">${posTag(e.role)}<span>${e.p.n}${e.st === 'red' ? ' <span class="tag sus">EXP</span>' : e.st === 'inj' ? ' <span class="tag inj">LES</span>' : ''}${m.ycs.get(e.p) ? ' <span class="tag yc">A</span>' : ''}</span><b>${e.p.f}</b>${bar(e.p.en)}<span></span></div>`).join('');
  const bench = X.bench.map(p => `<div class="lp ${L.sb === p.id ? 'sel' : ''}" onclick="liveSel('b',${p.id})">${posTag(p.pos)}<span>${p.n}</span><b>${p.f}</b>${bar(p.en)}<span></span></div>`).join('') || '<div class="muted">Banco vazio.</div>';
  const sel = (k, arr, cur) => `<select onchange="liveTac('${k}',this.value)">${arr.map((s, i) => `<option value="${i}" ${i === cur ? 'selected' : ''}>${s.n}</option>`).join('')}</select>`;
  const ctl = online() ? netLiveCtl() : L.done ? `<button class="primary" onclick="afterMatch()">Continuar</button>` :
    `<button class="primary" onclick="livePlay()">${L.paused ? (L.started ? 'Continuar' : 'Iniciar') : 'Pausar'}</button>
     ${['1x', '2x', '4x'].map((n, i) => `<button class="${L.speed === i ? 'on' : ''}" onclick="liveSpeed(${i})">${n}</button>`).join('')}
     <button onclick="liveSkip()" title="Simula o resto do jogo de uma vez">Ir para o resultado</button>`;
  const tot = m.h.pos + m.a.pos || 1, ph = Math.round(m.h.pos / tot * 100);
  const stl = (a, b, t) => `<div class="stl"><b>${a}</b><span class="muted">${t}</span><b>${b}</b></div>`;
  const stats = m.min ? stl(ph + '%', (100 - ph) + '%', 'Posse de bola') + stl(`${m.h.sh} (${m.h.sot})`, `${m.a.sh} (${m.a.sot})`, 'Finalizações (no gol)') + stl(ycN(m, 'h'), ycN(m, 'a'), 'Cartões amarelos') : '';
  const notas = L.done ? [...X.played].sort((a, b) => (b.lr || 0) - (a.lr || 0)).map(p => `<div class="lp" style="cursor:default">${posTag(p.pos)}<span>${p.n}${m.gl.get(p) ? ' ⚽'.repeat(m.gl.get(p)) : ''}</span><span></span><span></span><b class="${p.lr >= 7 ? 'up' : p.lr < 5.5 ? 'down' : ''}">${(p.lr || 0).toFixed(1)}</b></div>`).join('') : '';
  let end = '';
  if (L.done) {
    end = `Fim de jogo. Público no estádio: ${num(fx.att || 0)}.`;
    if (fx.pen) end += ` Pênaltis: ${m.h.t.name} ${fx.pen[0]} x ${fx.pen[1]} ${m.a.t.name}.`;
    if (fx.w != null) end += fx.w === me.id ? ' <b class="up">Seu time avança!</b>' : ' <b class="down">Seu time está eliminado.</b>';
  }
  return `<div class="live"><div class="livehead"><div class="clock">${L.done ? 'FIM' : m.min + "'"}</div><b>${L.title}</b><span style="margin-left:auto" class="row">${ctl}</span></div>
    <div class="cols2"><div class="panel">${games}</div>
    <div class="grid"><div class="panel"><div class="score"><div>${crest(m.h.t, 44)}<div class="n">${m.h.t.name}</div></div><div class="big">${m.h.g} x ${m.a.g}</div><div>${crest(m.a.t, 44)}<div class="n">${m.a.t.name}</div></div></div>
      ${fx.agg ? `<div class="muted c" style="margin-bottom:8px">Jogo de ida: ${m.h.t.name} ${fx.agg[0]} x ${fx.agg[1]} ${m.a.t.name} · agregado ${m.h.g + fx.agg[0]} x ${m.a.g + fx.agg[1]}</div>` : fx.ko ? '<div class="muted c" style="margin-bottom:8px">Jogo único: empate leva para os pênaltis.</div>' : ''}
      ${stats}${L.msg ? `<div class="msg">${L.msg}</div>${online() ? readyChips() : ''}` : ''}${end ? `<div class="msg">${end}</div>` : ''}
      <div class="feed">${feed || '<div class="muted">A partida ainda não começou.</div>'}</div></div>
    ${L.done ? `<div class="panel"><h3>Notas do ${me.name}</h3>${notas}</div>` : `<div class="panel"><div class="field" style="margin:0 0 10px"><span class="muted">Estilo</span>${sel('style', STYLE, me.style)}<span class="muted">Marcação</span>${sel('mark', MARK, me.mark)}</div>
      <div class="cols2" style="gap:10px"><div><h3>Em campo</h3>${on}</div><div><h3>Banco</h3>${bench}
      <button class="primary" style="width:100%;margin-top:10px" ${L.so != null && L.sb != null ? '' : 'disabled'} onclick="liveSub()">Substituir (${X.subs}/5)</button></div></div></div>`}</div></div></div>`;
}

/* ---------- fim de temporada ---------- */

function vSeason() {
  const me = T(G.me), tabs = [0, 1, 2, 3].map(table), pos = tabs[me.div].findIndex(r => r.t === me) + 1;
  const prize = Math.round(PRIZE[me.div] * (21 - pos) / 20), rk = regOf(me);
  const fate = me.div > 0 && pos <= 4 ? `<span class="up">Acesso garantido para a ${DIVS[me.div - 1]}!</span>` : me.div < 3 && pos > 16 ? `<span class="down">Rebaixado para a ${DIVS[me.div + 1]}.</span>` :
    me.div === 0 && pos === 1 ? '<span class="amber">CAMPEÃO BRASILEIRO!</span>' : `Permanece na ${DIVS[me.div]}.`;
  const cards = tabs.map((tb, d) => {
    const top = G.teams.filter(t => t.div === d).flatMap(t => t.players.map(p => ({ p, t }))).sort((a, b) => b.p.g - a.p.g)[0];
    return `<div class="panel"><h3>${DIVS[d]}</h3><div class="row">${crest(tb[0].t, 30)}<div><b>${tb[0].t.name}</b><div class="muted">Campeão · ${tb[0].pts} pontos</div></div></div>
      <div style="margin-top:10px;font-size:13px">${d > 0 ? `<div><span class="up">Sobem:</span> ${tb.slice(0, 4).map(r => r.t.name).join(', ')}</div>` : ''}
      ${d < 3 ? `<div><span class="down">Caem:</span> ${tb.slice(-4).map(r => r.t.name).join(', ')}</div>` : ''}
      <div><span class="muted">Artilheiro:</span> ${top.p.n} (${top.t.name}), ${top.p.g} gols</div></div></div>`;
  }).join('');
  const exp = me.players.filter(p => p.ce <= G.season && !p.loan), aw = awards(me.div), met = pos <= MY().goal.pos;
  const awCard = aw.best ? `<div class="panel" style="margin-top:14px"><h3>Prêmios da ${DIVS[me.div]}</h3><div class="row">${crest(aw.best.t, 30)}<div><b>${aw.best.p.n}</b> <span class="muted">(${aw.best.t.name})</span><div class="muted">Melhor jogador da temporada · nota média ${aw.best.r.toFixed(2)} · ${aw.best.p.g} gols</div></div></div>
    <div class="chips" style="margin-top:10px"><span class="muted" style="font-size:12px">Seleção da temporada:</span>${aw.xi.map(x => `<span class="chip ${x.t.id === G.me ? 'mine' : ''}">${POSN[x.p.pos]} ${x.p.n} · ${x.t.name} · ${x.r.toFixed(1)}</span>`).join('')}</div></div>` : '';
  const jobs = MY().jobs.map(id => { const t = T(id); return `<div class="row" style="margin-top:8px">${crest(t, 26)}<div><b>${t.name}</b> <span class="muted">${DIVS[t.div]} · força ${Math.round(top11(t))} · caixa ${$$(t.cash)}</span></div><button style="margin-left:auto" onclick="askJob(${id})">Aceitar e iniciar ${G.season + 1}</button></div>`; }).join('');
  return `<div class="start"><div class="panel" style="text-align:center;padding:26px">${crest(me, 60)}<h1 style="margin-top:8px">Fim da temporada ${G.season}</h1>
      <div style="font-size:18px;margin:8px 0">${me.name}: ${pos}º lugar na ${DIVS[me.div]}. ${fate}</div>
      <div>Objetivo da diretoria: ${MY().goal.txt}. ${met ? '<b class="up">Cumprido.</b>' : '<b class="down">Não cumprido.</b>'}</div>
      <div class="muted">Premiação da liga: ${$$(prize)} · Copa do Brasil: ${T(G.cup.champ).name}${G.am && G.am.champ != null ? ` · ${AM_NAME}: ${T(G.am.champ).name}` : ''} · ${REGS[rk].n}: ${T(G.reg[rk].champ).name}</div>
      ${exp.length ? `<div class="msg" style="margin:14px auto 0;max-width:640px;text-align:left"><b>Contratos terminando:</b> ${exp.map(p => `${p.n} (${POSN[p.pos]} ${p.f})`).join(', ')}. Quem não renovar agora deixa o clube de graça na virada.</div>` : ''}
      <div class="row" style="justify-content:center;margin-top:16px"><button style="padding:10px 22px" onclick="UI.view='hub';go('elenco')">Voltar ao clube</button>
      <button class="primary" style="padding:10px 22px" onclick="nextSeason()">${playLabel('Iniciar temporada ' + (G.season + 1))}</button></div>${readyChips()}</div>
    ${jobs ? `<div class="panel" style="margin-top:14px"><h3>Convites de outros clubes</h3><div class="muted">Seu trabalho chamou atenção. Se aceitar, você assume o novo clube já na próxima temporada.</div>${jobs}</div>` : ''}
    ${awCard}<div class="pickgrid">${cards}</div></div>`;
}
function askJob(id) {
  const t = T(id);
  confirmBox('Trocar de clube', `Deixar o ${T(G.me).name} e assumir o <b>${t.name}</b> (${DIVS[t.div]})? Você começa do zero com o elenco, o caixa e a base do novo clube.`, 'Aceitar', () => nextSeason(id));
}
function nextSeason(job) {
  if (online()) { netNextSeason(job); return; }
  rollover();
  if (job != null && !MY().fired) takeOver(job);
  skipByes();
  const me = T(G.me);
  if (!validXI(me)) autoPick(me);
  UI.view = 'hub'; go('news');
}

render();
</script>
</body>
</html>
